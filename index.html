<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R WEATHER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

     <div class="weather-card">
        <div class="search-box">
            <input type="text" class="search-input" placeholder="Введите город...">
            <button class="search-button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="error-message">
            <p>City is not detected</p>
        </div>

        <div class="weather-info">
            <img src="https://openweathermap.org/img/wn/01d@2x.png" alt="weather icon" class="weather-icon">
                <h1 class="temp">22°C</h1>
                <h2 class="city">Moscow</h2>

                <div class="details">
                    <div class="comlumn">
                        <i class="fa-solid fa-water"></i>
                    </div>
                    <div>
                        <p class="humidity">60%</p>
                        <p>Влажность</p>
                    </div>
                </div>

                <div class="column">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <p class="wind">15 km</p>
                        <p>Ветер</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
